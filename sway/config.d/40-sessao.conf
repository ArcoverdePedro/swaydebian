# Atualiza o ambiente para aplicativos e portais do usuario.
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway XDG_SESSION_TYPE=wayland

# Agente de autorizacao, rede e notificacoes nativos do ambiente.
exec lxpolkit
exec nm-applet --indicator
exec mako

# Bloqueio apos 15 minutos sem atividade e antes de suspender.
exec swayidle -w timeout 900 'swaylock -f -c 282828' before-sleep 'swaylock -f -c 282828'

# O Sway gerencia a inicializacao da barra, sem exec_always duplicado.
bar {
    swaybar_command waybar
}
