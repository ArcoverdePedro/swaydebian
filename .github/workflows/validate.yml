name: Validar configuracoes

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar shell e JSON
        run: |
          bash -n install.sh debian_coisas.sh scripts/install-dev.sh
          python3 -m json.tool waybar/config >/dev/null
          python3 -m json.tool User/settings.json >/dev/null
          python3 -m json.tool User/keybindings.json >/dev/null
      - name: Validar Sway
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sway
          cp sway/local.conf.example sway/local.conf
          sway -C -c "$PWD/sway/config"
